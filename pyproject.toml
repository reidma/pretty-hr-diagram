[project]
name = "hr-diagram"
version = "0.1.0"
description = "Teaching-oriented Hertzsprung-Russell diagram generator built on Gaia DR3 and Hipparcos data"
readme = "README.md"
authors = [{ name = "Mike Reid" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "ipykernel>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hr_diagram"]
