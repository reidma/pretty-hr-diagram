[project]
name = "pretty-hr-diagram"
version = "1.0.0"
description = "Teaching-oriented Hertzsprung-Russell diagram generator built on Gaia DR3 and Hipparcos data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Reid" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.urls]
Repository = "https://github.com/reidma/pretty-hr-diagram"

[dependency-groups]
dev = [
    "ipykernel>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hr_diagram"]
